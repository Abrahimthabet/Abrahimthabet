app = "haulclock-api"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  DETENTION_FREE_HOURS = "2"
  DETENTION_HOURLY_RATE = "75"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
